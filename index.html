<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rutina de Gym Semanal</title>

  <style>
    /* ===== COLORES ===== */
    :root {
      --bg:   #f6f7f9;
      --card: #ffffff;
      --tx:   #1b1f27;
      --mu:   #5d6675;
      --ac:   #e8541e;
      --bd:   #e3e6eb;
      --sv:   #fdeee7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:   #14171c;
        --card: #1e232b;
        --tx:   #eef0f4;
        --mu:   #9aa3b2;
        --ac:   #ff7a45;
        --bd:   #2d343f;
        --sv:   #2a2420;
      }
    }

    /* ===== BASE ===== */
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: var(--bg);
      color: var(--tx);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    header, .modes, nav, main { max-width: 820px; margin: auto; }
    header { padding: 28px 16px 8px; }
    h1 { margin: 0; font-size: 1.8rem; }
    header p { margin: 4px 0 0; color: var(--mu); }
    h2 { font-size: 1.25rem; margin: 18px 0 12px; }
    main { padding: 0 16px 40px; }

    /* ===== FONDO CON IMAGEN ===== */
    :root {
      --fondo-img: url("https://i.pinimg.com/736x/68/5c/cf/685ccffac1a57a471e8e326e88202cc4.jpg");
      --fondo-size: cover;        /* cubre toda la pantalla sin repetirse */
      --fondo-repeat: no-repeat;
      --fondo-opacidad: .14;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fondo-opacidad: .22; }
    }
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100lvh;             /* celular: altura completa aunque la barra del navegador se oculte */
      z-index: -1;
      background-image: var(--fondo-img);
      background-size: var(--fondo-size);
      background-repeat: var(--fondo-repeat);
      background-position: center;
      opacity: var(--fondo-opacidad);
      pointer-events: none;
    }

    /* ===== BOTONES ===== */

    .modes { display: flex; gap: 8px; padding: 10px 16px 0; }
    nav    { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; }
    .modes button, nav button {
      flex: 0 0 auto;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: .9rem;
      cursor: pointer;
    }
    .modes button.on, nav button.on {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac);
    }
    nav button.rest-day { opacity: .75; }

    /* ===== NIVELES DE ENTRENAMIENTO ===== */
    .levels { flex-wrap: wrap; }
    .nivel-info { max-width: 820px; margin: 0 auto; padding: 10px 16px 0; }
    .nivel-card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-left: 4px solid var(--ac);
      border-radius: 14px;
      padding: 12px 14px;
    }
    .nivel-card h3 { margin: 0 0 8px; font-size: 1.05rem; }
    .nivel-card h3 small { font-weight: 400; font-size: .82rem; color: var(--mu); }
    .nivel-card p { margin: 4px 0; font-size: .9rem; color: var(--mu); }
    .nivel-card b { color: var(--tx); }

    /* ===== TARJETA DE EJERCICIO ===== */
    .ex {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .pic svg, .pic img {
      width: 170px;
      height: 140px;
      border-radius: 10px;
      display: block;
    }
    .pic svg { background: var(--sv); color: var(--ac); }
    .pic img { object-fit: cover; }

    .ex h3 { margin: 0 0 4px; font-size: 1.05rem; }
    .ex p  { margin: 4px 0; font-size: .92rem; color: var(--mu); }
    .ex b  { color: var(--tx); }
    .ex ol { margin: 4px 0 0; padding-left: 18px; font-size: .9rem; color: var(--mu); }
    .tag {
      display: inline-block;
      background: var(--sv);
      color: var(--ac);
      font-size: .78rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      margin: 0 6px 6px 0;
    }

    /* ===== DÍA DE DESCANSO ===== */
    .rest {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 18px;
    }
    .rest-hero {
      height: 190px;
      background: linear-gradient(135deg, #1f2a44, #3b2f63 60%, var(--ac));
    }
    .rest-hero svg, .rest-hero img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .rest-body { padding: 22px 20px 24px; text-align: center; }
    .rest-body h3 { margin: 0 0 6px; font-size: 1.35rem; }
    .rest-body > p { margin: 0; color: var(--mu); }
    .rest-tips {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 18px;
      text-align: left;
    }
    .tip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--sv);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .tip .ic { font-size: 1.6rem; }
    .tip b    { display: block; font-size: .92rem; }
    .tip span { font-size: .8rem; color: var(--mu); }

    /* ===== PC / TABLET ANCHO: tarjetas en 2 columnas ===== */
    @media (min-width: 1000px) {
      header, .modes, nav, main, .nivel-info { max-width: 1100px; }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 16px;
        align-items: start;
      }
      main > h2, main > .rest { grid-column: 1 / -1; }
    }

    /* ===== CELULAR EN HORIZONTAL (poca altura) ===== */
    @media (max-height: 480px) and (orientation: landscape) {
      header { padding-top: 12px; }
      h1 { font-size: 1.4rem; }
      .rest-hero { height: 120px; }
    }

    /* ===== MÓVIL ===== */
    @media (max-width: 560px) {
      .ex { grid-template-columns: 1fr; }
      .pic svg, .pic img { width: 100%; }
      .rest-tips { grid-template-columns: 1fr; }
    }
  </style>
</head>

    /* =====================================================
       3) CÓDIGO DE LA PÁGINA (no necesitas tocar esto)
       ===================================================== */
    const nav  = document.getElementById('nav');
    const main = document.getElementById('main');
    let modo = 'dia';
    let diaActual = 0;

    /* =====================================================
       NIVELES DE ENTRENAMIENTO
       ► El campo  series  de cada ejercicio es el del nivel
         INTERMEDIO. Principiante y Avanzado se calculan solos
         con las reglas de abajo (series y repeticiones).
       ===================================================== */
    const NIVELES = {
      principiante: {
        icono: '🟢', nombre: 'Principiante', para: 'Menos de 6 meses entrenando',
        series: 'una serie menos por ejercicio (mínimo 2)',
        descanso: '60-90 s',
        intensidad: 'Peso ligero: deja 3-4 repeticiones en reserva.',
        consejo: 'Aprende la técnica antes de subir peso. Sube la carga solo cuando completes todas las repeticiones con buena forma.',
        delta: -1
      },
      intermedio: {
        icono: '🟡', nombre: 'Intermedio', para: '6 meses a 2 años entrenando',
        series: 'las indicadas en cada ejercicio',
        descanso: '60-90 s',
        intensidad: 'Peso moderado: deja 1-2 repeticiones en reserva.',
        consejo: 'Sobrecarga progresiva: cuando llegues al máximo de repeticiones en todas las series, sube un poco el peso.',
        delta: 0
      },
      avanzado: {
        icono: '🔴', nombre: 'Avanzado', para: 'Más de 2 años entrenando',
        series: 'una serie más por ejercicio (máximo 5)',
        descanso: '90-120 s',
        intensidad: 'Peso pesado: llega a 0-1 repeticiones en reserva en la última serie.',
        consejo: 'Exige más recuperación: duerme bien, come suficiente proteína y baja el peso una semana cada 6-8 semanas.',
        delta: 1
      }
    };

    /* Repeticiones por nivel, según las del nivel intermedio */
    const REPS = {
      principiante: { '8-10': '10-12', '10': '12', '10-12': '12-15', '12': '12', '12-15': '15', '15': '15' },
      avanzado:     { '8-10': '6-8',   '10': '8',  '10-12': '8-10',  '12': '10', '12-15': '10-12', '15': '12-15' }
    };

    let nivel = 'intermedio';
    try {
      const guardado = localStorage.getItem('nivelGym');
      if (NIVELES[guardado]) nivel = guardado;
    } catch (e) {}

    // "4 × 8-10" (intermedio) → series y repeticiones del nivel elegido
    function seriesNivel(texto) {
      const m = texto.match(/^(\d+) × ([\d-]+)(.*)$/);
      if (!m || nivel === 'intermedio') return texto;
      const series = Math.min(5, Math.max(2, +m[1] + NIVELES[nivel].delta));
      const reps = REPS[nivel][m[2]] || m[2];
      return `${series} × ${reps}${m[3]}`;
    }

    function renderNivel() {
      const n = NIVELES[nivel];
      [...document.getElementById('levels').children]
        .forEach(b => b.classList.toggle('on', b.dataset.nivel === nivel));
      document.getElementById('nivelInfo').innerHTML = `
        <div class="nivel-card">
          <h3>${n.icono} ${n.nombre} <small>· ${n.para}</small></h3>
          <span class="tag">Series: ${n.series}</span>
          <span class="tag">Descanso entre series: ${n.descanso}</span>
          <p><b>Intensidad:</b> ${n.intensidad}</p>
          <p><b>Consejo:</b> ${n.consejo}</p>
        </div>`;
    }

    function htmlImagen(ej) {
      const dibujo = DIBUJOS[ej.dibujo] || '';
      if (!ej.img) return dibujo;
      const respaldo = dibujo.replace(/"/g, '&quot;');
      return `<img src="${ej.img}" alt="${ej.nombre}" loading="lazy" onerror="this.outerHTML='${respaldo}'">`;
    }

    function htmlEjercicio(ej) {
      return `
        <div class="ex">
          <div class="pic">${htmlImagen(ej)}</div>
          <div>
            <h3>${ej.nombre}</h3>
            <span class="tag">${ej.musculo}</span>
            <span class="tag">${seriesNivel(ej.series)}</span>
            <p><b>¿Para qué sirve?</b> ${ej.sirve}</p>
            <p><b>Cómo se usa:</b></p>
            <ol>${ej.pasos.map(p => `<li>${p}</li>`).join('')}</ol>
          </div>
        </div>`;
    }

    /* Imagen del día de descanso. Pon aquí tu ruta o URL; si la dejas vacía
       (o no carga) se muestra una ilustración de luna y estrellas. */
    const IMG_DESCANSO = '';

    const DIBUJO_DESCANSO =
      '<svg viewBox="0 0 400 190" preserveAspectRatio="xMidYMid slice">' +
      '<g fill="#fff">' +
      '<circle cx="60" cy="40" r="2.5" opacity=".8"/><circle cx="130" cy="95" r="2" opacity=".6"/>' +
      '<circle cx="320" cy="35" r="2.5" opacity=".8"/><circle cx="360" cy="110" r="2" opacity=".6"/>' +
      '<circle cx="250" cy="60" r="1.8" opacity=".7"/><circle cx="90" cy="150" r="1.8" opacity=".5"/></g>' +
      '<path d="M215 40a55 55 0 1 0 55 75A62 62 0 0 1 215 40z" fill="#ffe7a8"/>' +
      '<text x="285" y="70" font-size="26" fill="#fff" opacity=".9" font-weight="700">z</text>' +
      '<text x="308" y="52" font-size="20" fill="#fff" opacity=".7" font-weight="700">z</text>' +
      '<text x="326" y="38" font-size="15" fill="#fff" opacity=".5" font-weight="700">z</text>' +
      '</svg>';

    function htmlImagenDescanso() {
      if (!IMG_DESCANSO) return DIBUJO_DESCANSO;
      const respaldo = DIBUJO_DESCANSO.replace(/"/g, '&quot;');
      return `<img src="${IMG_DESCANSO}" alt="Día de descanso" loading="lazy" onerror="this.outerHTML='${respaldo}'">`;
    }

    function htmlDescanso() {
      return `
        <div class="rest">
          <div class="rest-hero">${htmlImagenDescanso()}</div>
          <div class="rest-body">
            <h3>Día de descanso</h3>
            <p>Tus músculos crecen mientras descansas. Recupérate para rendir mejor.</p>
            <div class="rest-tips">
              <div class="tip"><span class="ic">😴</span><div><b>Duerme</b><span>7-9 horas</span></div></div>
              <div class="tip"><span class="ic">💧</span><div><b>Hidrátate</b><span>Agua durante todo el día</span></div></div>
              <div class="tip"><span class="ic">🥗</span><div><b>Come bien</b><span>Proteína y verduras</span></div></div>
              <div class="tip"><span class="ic">🚶</span><div><b>Camina</b><span>20-30 min suaves</span></div></div>
            </div>
          </div>
        </div>`;
    }

    function htmlDia(d) {
      const cuerpo = d.descanso ? htmlDescanso() : d.ejercicios.map(htmlEjercicio).join('');
      return `<h2>${d.dia} · ${d.titulo}</h2>${cuerpo}`;
    }

    function dibujar() {
      renderNivel();
      document.getElementById('btnDia').classList.toggle('on', modo === 'dia');
      document.getElementById('btnSemana').classList.toggle('on', modo === 'semana');
      nav.style.display = modo === 'dia' ? 'flex' : 'none';
      [...nav.children].forEach((b, i) => b.classList.toggle('on', i === diaActual));
      main.innerHTML = modo === 'dia' ? htmlDia(RUTINA[diaActual]) : RUTINA.map(htmlDia).join('');
    }

    RUTINA.forEach((d, i) => {
      const b = document.createElement('button');
      b.textContent = d.dia;
      if (d.descanso) b.className = 'rest-day';
      b.onclick = () => { diaActual = i; dibujar(); };
      nav.appendChild(b);
    });

    document.getElementById('btnDia').onclick    = () => { modo = 'dia';    dibujar(); };
    document.getElementById('btnSemana').onclick = () => { modo = 'semana'; dibujar(); };

    Object.keys(NIVELES).forEach(k => {
      const b = document.createElement('button');
      b.dataset.nivel = k;
      b.textContent = NIVELES[k].icono + ' ' + NIVELES[k].nombre;
      b.onclick = () => {
        nivel = k;
        try { localStorage.setItem('nivelGym', k); } catch (e) {}
        dibujar();
      };
      document.getElementById('levels').appendChild(b);
    });

    dibujar();
  </script>
